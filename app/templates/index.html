<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도도리 - 공공 도서관의 도서 리뷰</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/index.css') }}">
</head>

<body>
    <div class="app-container">
        <header>
            <a href="/" class="logo">
                <img src="{{ url_for('static', path='/images/logo.png') }}" alt="도도리 로고">
                <span>도도리</span>
            </a>
            <p class="logo-subtitle">공공 도서관의 도서 리뷰</p>
        </header>
        <main>
            <section class="search-section">
                <div class="search-box">
                    <button id="searchBtn">🔍</button>
                    <input type="text" id="searchInput" placeholder="도서를 검색해보세요">
                </div>
            </section>
            <section class="recent-books">
                <div class="recent-header">
                    <h3>🕒 최근 본 도서</h3>
                    <button class="clear-all-btn">전체 삭제</button>
                </div>
                <div class="recent-tags">
                    <span class="recent-tag-item">사피엔스</span>
                    <span class="recent-tag-item">사피엔스</span>
                    <span class="recent-tag-item">사피엔스</span>
                </div>
                <div class="recent-tags-empty">최근 본 도서가 없습니다.</div>
            </section>
            <section class="favorites">
                <h3>⭐ 즐겨찾기</h3>
                <div class="favorites-books">
                    <div class="favorite-card">
                        <img src="{{ url_for('static', path='/images/book-example.jpg') }}" alt="">
                        <span class="favorite-title">책 제목</span>
                        <span class="favorite-author">저자</span>
                    </div>
                    <div class="favorite-card">
                        <img src="{{ url_for('static', path='/images/book-example.jpg') }}" alt="">
                        <span class="favorite-title">책 제목</span>
                        <span class="favorite-author">저자</span>
                    </div>
                    <div class="favorite-card">
                        <img src="" alt="">
                        <span class="favorite-title">책 제목</span>
                        <span class="favorite-author">저자</span>
                    </div>
                </div>
                <div class="favorites-empty">즐겨찾기한 책이 없습니다.</div>

            </section>
        </main>
        <nav class="bottom-nav">
            <a href="/" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">홈</span>
            </a>
            <a href="/search" class="nav-item">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">검색</span>
            </a>
        </nav>
    </div>

</body>

</html>
